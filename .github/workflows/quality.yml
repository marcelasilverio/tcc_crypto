name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check imports and static errors
        run: python -m ruff check src/tcc_crypto tests scripts
      - name: Check formatting
        run: python -m ruff format --check src/tcc_crypto tests scripts
      - name: Validate knowledge documentation
        run: python scripts/validate_okf_docs.py docs
      - name: Run tests, including architecture and notebook contracts
        run: PYTHONPATH=src python -m pytest -q
