[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-crypto"
version = "0.1.0"
description = "Cryptocurrency portfolio selection research using SVM and Markowitz optimization."
requires-python = ">=3.11"
dependencies = [
    "feature-engine>=1.8,<2.0",
    "matplotlib>=3.8,<4.0",
    "openpyxl>=3.1,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "TA-Lib>=0.8,<0.9",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7.0",
    "jupyterlab>=4.2,<5.0",
    "PyYAML>=6.0.3,<7.0",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
