[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-crypto"
version = "0.1.0"
description = "Cryptocurrency portfolio selection research using SVM and Markowitz optimization."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7.0",
    "jupyterlab>=4.2,<5.0",
    "PyYAML>=6.0.3,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
